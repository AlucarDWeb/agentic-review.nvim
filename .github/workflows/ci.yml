name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.3.1
          args: --check lua tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.10.4, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim ${{ matrix.nvim }}
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=nvim-linux-x86_64.tar.gz ;;
            macOS) asset=nvim-macos-arm64.tar.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/nvim"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${{ matrix.nvim }}/$asset" \
            | tar -xz -C "$RUNNER_TEMP/nvim" --strip-components=1
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"
      - run: nvim --version | head -1
      - run: tests/run.sh
